<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GovGrid | AI-Powered DPI Public Budget Reconciliation</title>
    <meta name="description" content="AI for Digital Public Infrastructure: Bridging citizen grievances with public budget execution via Vertex AI and BigQuery GIS." />
    <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Tailwind CSS with Stitch Theme Configuration -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "var(--primary)",
              "primary-container": "var(--emerald-subtle)",
              "secondary": "var(--emerald-dark)",
              "secondary-container": "var(--emerald-bg)",
              "surface": "var(--bg-app)",
              "surface-card": "var(--bg-surface)",
              "surface-dim": "var(--bg-elevated)",
              "surface-container": "var(--bg-elevated)",
              "surface-container-low": "var(--bg-surface)",
              "on-surface": "var(--text-primary)",
              "on-surface-variant": "var(--text-secondary)",
              "outline": "var(--border)",
              "outline-variant": "var(--border-subtle)",
              "pastel-mint": "var(--emerald-bg)",
              "pastel-mint-text": "var(--emerald)",
              "pastel-amber": "var(--amber-subtle)",
              "pastel-amber-text": "var(--amber-bright)",
              "pastel-rose": "var(--rose-subtle)",
              "pastel-rose-text": "var(--rose-bright)",
              "pastel-blue": "var(--slate-subtle)",
              "pastel-blue-text": "var(--text-secondary)",
              "pastel-purple": "var(--amber-subtle)",
              "pastel-purple-text": "var(--amber-bright)",
              "coral": "var(--amber-dark)",
              "coral-light": "var(--amber-subtle)"
            },
            fontFamily: {
              sans: ['"Inter"', 'sans-serif'],
              display: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            },
            borderRadius: {
              '2xl': '1rem',
              '3xl': '1.5rem',
              '4xl': '2rem'
            }
          }
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
