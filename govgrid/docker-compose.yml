version: '3.8'

services:
  govgrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgrid-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-eventflow-e3c91}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET:-govgrid_dpi}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-govgrid-audio-bucket}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-sa.json
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped
